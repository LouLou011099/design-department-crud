```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Anggota</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #ffc107;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0a800;
        }

        .kembali {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Anggota Tim</h1>

        <form method="POST">

            <label>Nama</label>

            <input
                type="text"
                name="nama"
                value="{{ data['nama'] }}"
                required
            >


            <label>Jabatan</label>

            <input
                type="text"
                name="jabatan"
                value="{{ data['jabatan'] }}"
                required
            >


            <label>Jobdesk</label>

            <textarea
                name="jobdesk"
            >{{ data['Jobdesk'] }}</textarea>


            <button type="submit">
                Simpan Perubahan
            </button>

        </form>

        <a href="/" class="kembali">
            ← Kembali ke Daftar
        </a>

    </div>

</body>

</html>
```
